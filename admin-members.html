<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Members | Strong Foodie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF7F2; --warm-white: #FFFDF9; --ink: #1A1208; --ink-soft: #3D2F1A;
    --muted: #8A7A66; --border: rgba(26,18,8,0.12); --accent: #D4521A;
    --accent-pale: #FBF3EF; --gold: #C8901A; --green: #2D5A3D; --green-light: #E8F2EC; --red: #A32323; --red-pale: #FBECEC;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); font-size: 15px; }
  .top { background: var(--ink); color: #fff; display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem; min-height: 58px; flex-wrap: wrap; }
  .top h1 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .top h1 span { color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.15em; margin-left: 6px; }
  .top nav { margin-left: auto; display: flex; gap: 1.1rem; }
  .top nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
  .msg { max-width: 460px; margin: 4rem auto; text-align: center; color: var(--ink-soft); line-height: 1.6; }
  .msg h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 0.5rem; }
  .msg a { color: var(--accent); }
  .lead { color: var(--ink-soft); line-height: 1.6; margin-bottom: 1.25rem; }
  .bar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  input[type=search] { flex: 1 1 240px; border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .chip { font: 500 13px 'DM Sans', sans-serif; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--warm-white); color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .count { font-size: 13px; color: var(--muted); margin-bottom: 0.6rem; }
  .list { display: flex; flex-direction: column; gap: 0.6rem; }
  .mem { background: var(--warm-white); border: 1px solid var(--border); border-radius: 14px; padding: 0.85rem 1rem; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 0.8rem; align-items: center; }
  .av { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }
  .mem-name { font-weight: 700; overflow-wrap: anywhere; }
  .mem-name a { color: var(--ink); text-decoration: none; }
  .mem-name a:hover { color: var(--accent); }
  .mem-meta { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .mem-meta a { color: var(--red); }
  .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase; margin-left: 4px; vertical-align: 2px; }
  .pill-blocked { background: var(--red-pale); color: var(--red); }
  .pill-trusted { background: var(--green-light); color: var(--green); }
  .pill-private { background: #F0EBE3; color: var(--ink-soft); }
  .pill-brand { background: var(--accent-pale); color: var(--accent); }
  .tools { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
  .btn { font: 500 13px 'DM Sans', sans-serif; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--border); background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--ink-soft); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-on { background: var(--green-light); color: var(--green); border-color: rgba(45,90,61,0.35); }
  .btn-danger { color: var(--red); border-color: rgba(163,35,35,0.35); }
  .btn-danger[data-armed] { background: var(--red); color: #fff; }
  .more { text-align: center; margin-top: 1rem; }
  .empty { background: var(--warm-white); border: 1px dashed var(--border); border-radius: 14px; padding: 2rem 1rem; text-align: center; color: var(--muted); }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all 0.25s; z-index: 100; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }
  @media (max-width: 700px) {
    .wrap { padding: 1rem 16px; }
    .top { padding: 0.7rem 16px; }
    .top nav { margin-left: 0; width: 100%; }
    .mem { grid-template-columns: 40px minmax(0, 1fr); }
    .av { width: 40px; height: 40px; font-size: 14px; }
    .tools { grid-column: 1 / -1; justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="top"><h1>Strong Foodie <span>MEMBERS</span></h1><nav><a href="admin-reports.html">🚩 Reports</a><a href="admin.html">← Admin</a></nav></div>
<main class="wrap" id="root"><p class="msg">Checking your account…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { esc, fold, toDate } from "./js/sf-places.js?v=7";
  import { requireUnlock, nextLink } from "./js/sf-admin.js?v=2";
  import { normReport } from "./js/sf-moderation.js?v=1";
  import { confirmTap } from "./js/sf-delete.js?v=1";

  const app = initializeApp({
    apiKey: "AIzaSyB_9UbXbYdY-TkYPLURESIkKAFLfYfwD3U",
    authDomain: "jongfoodie.firebaseapp.com",
    projectId: "jongfoodie",
    storageBucket: "jongfoodie.firebasestorage.app",
    messagingSenderId: "1006154240382",
    appId: "1:1006154240382:web:45dc5562f8205364aa232f"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  const root = document.getElementById('root');
  const BRAND_UID = 'B9cs5MwpvkUSIoiYh2qMwMnyl4B3';
  const COLOURS = ['#D4521A', '#2D5A3D', '#6B2A5C', '#2F5D7C', '#8A6A0A', '#A32323'];
  const colourOf = s => COLOURS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLOURS.length];
  const initialsOf = name => String(name || '?').trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || '?';
  const PAGE = 40;

  function toast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.toggle('error', error); t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), error ? 5000 : 2800);
  }
  const refused = e => e && e.code === 'permission-denied';

  let members = [], filter = 'all', shown = PAGE;

  onAuthStateChanged(auth, async user => {
    if (!user) { root.innerHTML = `<div class="msg"><h2>Sign in first</h2><p>This page is for Strong Foodie only. <a href="${nextLink()}">Sign in on the admin page</a> and you come straight back here.</p></div>`; return; }
    let admin = user.uid === BRAND_UID;
    try { const t = await user.getIdTokenResult(); admin = admin || (t.claims && t.claims.admin === true); } catch (e) {}
    if (!admin) { root.innerHTML = `<div class="msg"><h2>Only for Strong Foodie</h2><p>This account can't manage members.</p></div>`; return; }
    if (!(await requireUnlock(auth, user))) return;
    root.innerHTML = '<p class="msg">Loading members…</p>';
    try { await load(); }
    catch (e) { console.log('Members error:', e); root.innerHTML = '<div class="msg"><h2>Could not load</h2><p>Please refresh the page.</p></div>'; }
  });

  async function load() {
    const read = c => getDocs(collection(db, c)).then(s => s.docs.map(d => ({ id: d.id, ...d.data() }))).catch(e => { console.log(c + ' not read:', e.code || e); return []; });
    const [profiles, spots, reviews, highlights, flagDocs, reports] = await Promise.all([
      read('profiles'), read('userPlaces'), read('userReviews'), read('highlights'), read('memberFlags'), read('reports'),
    ]);
    const tally = (rows, key) => rows.reduce((m, r) => { if (r[key]) m[r[key]] = (m[r[key]] || 0) + 1; return m; }, {});
    const nSpots = tally(spots, 'addedByUserId'), nReviews = tally(reviews, 'authorId'), nHl = tally(highlights, 'authorId');
    const nReports = tally(reports.map(normReport).filter(r => r.status !== 'done'), 'ownerId');
    const flags = Object.fromEntries(flagDocs.map(f => [f.id, f]));
    members = profiles.map(p => {
      const f = flags[p.id] || {};
      const name = String(p.displayName || '').trim() || 'Member';
      return {
        uid: p.id, name, city: p.city || '', since: toDate(p.createdAt), priv: p.isPrivate === true,
        spots: nSpots[p.id] || 0, reviews: nReviews[p.id] || 0, highlights: nHl[p.id] || 0, reports: nReports[p.id] || 0,
        trusted: f.trusted === true, blocked: f.blocked === true, _q: fold(name + ' ' + (p.city || '')),
      };
    }).sort((a, b) => (b.reports - a.reports) || ((b.spots + b.reviews + b.highlights) - (a.spots + a.reviews + a.highlights)) || a.name.localeCompare(b.name));
    shell();
  }

  function shell() {
    root.innerHTML = `
      <p class="lead">Every member of the site and the app. <b>Trusted</b> puts a green mark next to their name on reviews and their profile. <b>Block</b> hides everything they added, on the site and in the app after Rork batch 14.</p>
      <div class="bar">
        <input type="search" id="find" placeholder="Search by name or city" aria-label="Search members" autocomplete="off">
        <div class="chips" role="group" aria-label="Show">
          ${[['all', 'All'], ['reported', 'Reported'], ['trusted', 'Trusted'], ['blocked', 'Blocked']].map(([k, t]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${t}</button>`).join('')}
        </div>
      </div>
      <p class="count" id="count"></p>
      <div class="list" id="list"></div>
      <div class="more" id="more" hidden><button class="btn" type="button" id="moreBtn">Show more</button></div>`;
    document.getElementById('find').addEventListener('input', () => { shown = PAGE; drawList(); });
    root.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      filter = b.dataset.f; shown = PAGE;
      root.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      drawList();
    }));
    document.getElementById('moreBtn').addEventListener('click', () => { shown += PAGE; drawList(); });
    drawList();
  }

  function visible() {
    const q = fold(document.getElementById('find').value).trim();
    return members.filter(m => (filter === 'all' || (filter === 'reported' && m.reports) || (filter === 'trusted' && m.trusted) || (filter === 'blocked' && m.blocked))
      && (!q || q.split(/\s+/).every(t => m._q.includes(t))));
  }

  function drawList() {
    const rows = visible();
    document.getElementById('count').textContent = `${rows.length} ${rows.length === 1 ? 'member' : 'members'}`;
    const list = document.getElementById('list');
    if (!rows.length) { list.innerHTML = '<div class="empty">No members here.</div>'; document.getElementById('more').hidden = true; return; }
    list.innerHTML = rows.slice(0, shown).map(m => {
      const brand = m.uid === BRAND_UID;
      const bits = [m.city, m.since ? 'since ' + m.since.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : '',
        `${m.spots} ${m.spots === 1 ? 'spot' : 'spots'} · ${m.reviews} ${m.reviews === 1 ? 'review' : 'reviews'} · ${m.highlights} ${m.highlights === 1 ? 'highlight' : 'highlights'}`].filter(Boolean);
      return `<div class="mem">
        <div class="av" style="background:${colourOf(m.uid)};">${esc(initialsOf(m.name))}</div>
        <div>
          <p class="mem-name"><a href="member.html?u=${encodeURIComponent(m.uid)}" target="_blank" rel="noopener">${esc(m.name)}</a>${brand ? '<span class="pill pill-brand">Strong Foodie</span>' : ''}${m.trusted ? '<span class="pill pill-trusted">Trusted</span>' : ''}${m.blocked ? '<span class="pill pill-blocked">Blocked</span>' : ''}${m.priv ? '<span class="pill pill-private">Private</span>' : ''}</p>
          <p class="mem-meta">${esc(bits.join(' · '))}${m.reports ? ` · <a href="admin-reports.html">${m.reports} open ${m.reports === 1 ? 'report' : 'reports'}</a>` : ''}</p>
        </div>
        ${brand ? '' : `<div class="tools">
          <button class="btn${m.trusted ? ' btn-on' : ''}" type="button" data-trust="${esc(m.uid)}" aria-pressed="${m.trusted}">${m.trusted ? '✓ Trusted' : 'Make trusted'}</button>
          <button class="btn${m.blocked ? '' : ' btn-danger'}" type="button" data-block="${esc(m.uid)}">${m.blocked ? 'Unblock' : 'Block'}</button>
        </div>`}
      </div>`;
    }).join('');
    document.getElementById('more').hidden = rows.length <= shown;
    list.querySelectorAll('[data-trust]').forEach(b => b.addEventListener('click', () => flag(b, b.dataset.trust, 'trusted')));
    list.querySelectorAll('[data-block]').forEach(b => b.addEventListener('click', () => flag(b, b.dataset.block, 'blocked')));
  }

  async function flag(btn, uid, key) {
    const m = members.find(x => x.uid === uid);
    if (!m) return;
    const on = !m[key];
    if (key === 'blocked' && on && !confirmTap(btn, 'Tap again: hides all their content')) return;
    btn.disabled = true;
    try {
      const data = { [key]: on, updatedAt: serverTimestamp() };
      if (key === 'blocked' && on) data.blockedAt = serverTimestamp();
      await setDoc(doc(db, 'memberFlags', uid), data, { merge: true });
      m[key] = on;
      toast(key === 'trusted'
        ? (on ? `${m.name} is now a trusted reviewer.` : `${m.name} is no longer marked as trusted.`)
        : (on ? `${m.name} is blocked. Their content is gone from the site.` : `${m.name} is unblocked.`));
      drawList();
    } catch (e) {
      console.log('Flag not saved:', e);
      toast(refused(e) ? 'The database refused: add the memberFlags rule in Firebase first.' : 'Did not work. Try again.', true);
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
