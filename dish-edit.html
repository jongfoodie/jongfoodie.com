<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dishes editor | Strong Foodie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF7F2; --warm-white: #FFFDF9; --ink: #1A1208; --ink-soft: #3D2F1A;
    --muted: #8A7A66; --border: rgba(26,18,8,0.12); --accent: #D4521A;
    --accent-pale: #FBF3EF; --gold: #C8901A; --green: #2D5A3D; --green-light: #E8F2EC; --red: #A32323;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); font-size: 15px; }
  .top { background: var(--ink); color: #fff; display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem; height: 58px; }
  .top h1 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .top h1 span { color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.15em; margin-left: 6px; }
  .top a { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 13px; margin-left: auto; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .msg { max-width: 460px; margin: 4rem auto; text-align: center; color: var(--ink-soft); line-height: 1.6; }
  .msg h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 0.5rem; }
  .msg a { color: var(--accent); }

  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 1.5rem; align-items: start; }
  .panel { background: var(--warm-white); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; }
  .panel h2 { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-bottom: 0.75rem; }
  .g-list { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.75rem; }
  .g-item { text-align: left; border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 0.6rem 0.75rem; font: 14px 'DM Sans', sans-serif; cursor: pointer; color: var(--ink); }
  .g-item:hover { border-color: var(--ink-soft); }
  .g-item.active { border-color: var(--accent); background: var(--accent-pale); }
  .g-item small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase; vertical-align: 1px; margin-right: 4px; }
  .pill-pub { background: var(--green-light); color: var(--green); }
  .pill-draft { background: #EFE8DC; color: var(--ink-soft); }

  .field { margin-bottom: 1rem; }
  .field label, .field .label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-bottom: 0.35rem; }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 0.3rem; line-height: 1.5; overflow-wrap: anywhere; }
  input[type=text], input[type=search], textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
  .btn { font: 500 14px 'DM Sans', sans-serif; padding: 10px 18px; border-radius: 22px; border: 1px solid var(--border); background: var(--warm-white); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--ink-soft); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-main { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-main:hover { background: #b8401a; border-color: #b8401a; }
  .btn-danger { color: var(--red); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
  .status { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .status label { display: flex; align-items: center; gap: 0.4rem; border: 1px solid var(--border); border-radius: 20px; padding: 7px 14px; cursor: pointer; font-size: 14px; background: #fff; }
  .status input { accent-color: var(--accent); }

  .picked { display: flex; flex-direction: column; gap: 0.6rem; }
  .pk { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 0.6rem; align-items: start; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem; }
  .pk-n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .pk-name { font-weight: 500; overflow-wrap: anywhere; }
  .pk-where { font-size: 12px; color: var(--muted); margin-bottom: 0.4rem; }
  .pk textarea { min-height: 54px; font-size: 14px; }
  .pk-tools { display: flex; flex-direction: column; gap: 0.3rem; }
  .pk-tools button { width: 32px; height: 30px; border: 1px solid var(--border); background: var(--warm-white); border-radius: 8px; cursor: pointer; font-size: 14px; }
  .pk-tools button:disabled { opacity: 0.35; cursor: default; }
  .pk-gone { font-size: 12px; color: var(--red); }
  .results { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.5rem; }
  .res { text-align: left; border: 1px dashed var(--border); background: #fff; border-radius: 10px; padding: 0.5rem 0.75rem; cursor: pointer; font: 14px 'DM Sans', sans-serif; color: var(--ink); }
  .res:hover { border-color: var(--accent); border-style: solid; }
  .res small { color: var(--muted); }
  .empty-note { font-size: 13px; color: var(--muted); padding: 0.5rem 0; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all 0.25s; z-index: 100; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr; gap: 0; }
    .wrap { padding: 1rem; }
  }
  .grp { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 1.1rem 0 0.1rem; }
  .ed-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .ed-head h2 { margin: 0; font-family: 'Playfair Display', serif; font-size: 22px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .panel h2 + .picked { margin-top: 0.5rem; }
  .st { color: var(--gold); }
  .tag { font-size: 12px; background: #F0EBE3; color: var(--ink-soft); border-radius: 12px; padding: 2px 9px; font-weight: 400; }
  .pk-n { background: #F0EBE3; font-size: 14px; }
</style>
</head>
<body>
<div class="top"><h1>Strong Foodie <span>DISHES</span></h1><a href="admin.html">← Admin</a></div>
<main class="wrap" id="root"><p class="msg">Checking your account…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { CATS, esc, fold, starStr, loadPlaces, placeKey, placeUrl } from "./js/sf-places.js?v=7";
  import { requireUnlock, nextLink } from "./js/sf-admin.js?v=2";
  import { confirmTap } from "./js/sf-delete.js?v=1";

  const app = initializeApp({
    apiKey: "AIzaSyB_9UbXbYdY-TkYPLURESIkKAFLfYfwD3U",
    authDomain: "jongfoodie.firebaseapp.com",
    projectId: "jongfoodie",
    storageBucket: "jongfoodie.firebasestorage.app",
    messagingSenderId: "1006154240382",
    appId: "1:1006154240382:web:45dc5562f8205364aa232f"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  const root = document.getElementById('root');
  const BRAND_UID = 'B9cs5MwpvkUSIoiYh2qMwMnyl4B3';
  const KINDS = ['Smash burger', 'Burger', 'Pizza', 'Pasta', 'Ramen', 'Sushi', 'Sandwich', 'Fries', 'Croissant', 'Pastry', 'Dessert', 'Ice cream', 'Coffee', 'Cocktail', 'Steak', 'Breakfast'];
  const RATINGS = [5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1];
  const fmt1 = n => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');

  function toast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.toggle('error', error); t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), error ? 5000 : 2800);
  }

  let catalog = [], byKey = new Map(), dishes = [], place = null, editing = null;

  onAuthStateChanged(auth, async user => {
    if (!user) { root.innerHTML = `<div class="msg"><h2>Sign in first</h2><p>This page is for Strong Foodie only. <a href="${nextLink()}">Sign in on the admin page</a> and you come straight back here.</p></div>`; return; }
    let admin = user.uid === BRAND_UID;
    try { const t = await user.getIdTokenResult(); admin = admin || (t.claims && t.claims.admin === true); } catch (e) {}
    if (!admin) { root.innerHTML = `<div class="msg"><h2>Only for Strong Foodie</h2><p>This account can't rate dishes.</p></div>`; return; }
    // Signed in is not enough: the password has to be entered again after an hour without use (js/sf-admin.js).
    if (!(await requireUnlock(auth, user))) return;
    root.innerHTML = '<p class="msg">Loading places and dishes…</p>';
    try {
      const [loaded, snap] = await Promise.all([loadPlaces(db), getDocs(collection(db, 'dishes')).catch(() => ({ docs: [] }))]);
      catalog = loaded.catalog;
      catalog.forEach(p => byKey.set(placeKey(p), p));
      dishes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      shell();
      const want = new URLSearchParams(location.search).get('place');
      open(want && byKey.has(want) ? want : null);
    } catch (e) {
      console.log('Dishes editor error:', e);
      root.innerHTML = '<div class="msg"><h2>Could not load</h2><p>Please refresh the page.</p></div>';
    }
  });

  const keyOfDish = d => `${d.placeColl}/${d.placeId}`;
  const dishesOf = k => dishes.filter(d => keyOfDish(d) === k).sort((a, b) => (b.rating || 0) - (a.rating || 0));
  const kinds = () => [...new Set(dishes.map(d => (d.kind || '').trim()).filter(Boolean).concat(KINDS))];

  function shell() {
    root.innerHTML = `
      <div class="layout">
        <aside class="panel">
          <h2>Places</h2>
          <input type="search" id="find" placeholder="Find a place you reviewed…" aria-label="Find a place" autocomplete="off">
          <div class="results" id="results"></div>
          <p class="grp">With dishes</p>
          <div class="g-list" id="withDishes"></div>
        </aside>
        <section class="panel" id="editor"></section>
      </div>
      <datalist id="kinds"></datalist>`;
    document.getElementById('find').addEventListener('input', search);
    drawSide();
  }

  function drawSide() {
    const keys = [...new Set(dishes.map(keyOfDish))].filter(k => byKey.has(k));
    document.getElementById('withDishes').innerHTML = keys.length ? keys.map(k => {
      const p = byKey.get(k), n = dishesOf(k).length;
      return `<button class="g-item${place && placeKey(place) === k ? ' active' : ''}" type="button" data-k="${esc(k)}">${esc(p.emoji)} ${esc(p.name)}<small>${n} ${n === 1 ? 'dish' : 'dishes'} · ${esc(p.where)}</small></button>`;
    }).join('') : '<p class="empty-note">No dishes yet. Find a place above and add its best dish.</p>';
    document.querySelectorAll('#withDishes .g-item').forEach(b => b.addEventListener('click', () => open(b.dataset.k)));
    document.getElementById('kinds').innerHTML = kinds().map(k => `<option value="${esc(k)}">`).join('');
  }

  function search() {
    const q = fold(document.getElementById('find').value).trim();
    const box = document.getElementById('results');
    if (q.length < 2) { box.innerHTML = ''; return; }
    const terms = q.split(/\s+/);
    const hits = catalog.filter(p => terms.every(t => p._name.includes(t) || p._place.includes(t))).slice(0, 8);
    box.innerHTML = hits.length ? hits.map(p => `<button class="res" type="button" data-k="${esc(placeKey(p))}">${esc(p.emoji)} ${esc(p.name)} <small>${esc(p.where)}</small></button>`).join('')
      : '<p class="empty-note">No reviewed place found.</p>';
    box.querySelectorAll('.res').forEach(b => b.addEventListener('click', () => { document.getElementById('find').value = ''; box.innerHTML = ''; open(b.dataset.k); }));
  }

  function open(k, dishId = null) {
    place = k ? byKey.get(k) : null;
    editing = dishId ? dishes.find(d => d.id === dishId) : null;
    drawSide();
    const e = document.getElementById('editor');
    if (!place) { e.innerHTML = '<h2>Dishes</h2><p class="hint">Pick a place on the left. Its dishes show on its page under "What to order", and dishes of the same kind make lists like Best Smash Burger in Amsterdam (from 3 dishes in a city).</p>'; return; }
    const list = dishesOf(k);
    const d = editing || {};
    e.innerHTML = `
      <div class="ed-head"><h2>${esc(place.emoji)} ${esc(place.name)}</h2><a class="btn btn-sm" href="${placeUrl(place)}" target="_blank" rel="noopener">View ↗</a></div>
      <p class="hint" style="margin-bottom:1rem;">${esc(place.where)}${place.rating ? ` · your score ${fmt1(place.rating)}` : ''}</p>
      <div class="picked">${list.length ? list.map(x => `
        <div class="pk">
          <span class="pk-n">🍴</span>
          <div><div class="pk-name">${esc(x.name)}${x.kind ? ` <span class="tag">${esc(x.kind)}</span>` : ''}</div>
            <div class="pk-where">${x.rating ? `<span class="st">${starStr(x.rating)}</span> ${fmt1(x.rating)}` : 'No score'}${x.note ? ' · ' + esc(x.note.slice(0, 90)) + (x.note.length > 90 ? '…' : '') : ''}</div></div>
          <div class="pk-tools"><button type="button" data-edit="${esc(x.id)}" title="Edit" aria-label="Edit ${esc(x.name)}">✎</button><button type="button" data-del="${esc(x.id)}" title="Delete" aria-label="Delete ${esc(x.name)}">✕</button></div>
        </div>`).join('') : '<p class="empty-note">No dishes for this place yet.</p>'}</div>

      <h2 style="margin-top:1.5rem;">${editing ? 'Edit dish' : 'Add a dish'}</h2>
      <div class="row">
        <div class="field"><label for="fName">Dish</label><input type="text" id="fName" maxlength="80" placeholder="Double Smash with pickles" value="${esc(d.name || '')}"></div>
        <div class="field"><label for="fKind">Kind</label><input type="text" id="fKind" list="kinds" maxlength="40" placeholder="Smash burger" value="${esc(d.kind || '')}"><p class="hint">Same kind, same list: use the same word each time.</p></div>
        <div class="field"><label for="fRating">Your score</label><select id="fRating">${RATINGS.map(r => `<option value="${r}"${(d.rating || 5) === r ? ' selected' : ''}>${fmt1(r)} ${'★'.repeat(Math.round(r))}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label for="fNote">What makes it good (optional)</label><textarea id="fNote" maxlength="400" placeholder="Crispy edges, soft bun, go for the double.">${esc(d.note || '')}</textarea></div>
      <div class="field"><label for="fPhoto">Photo</label><select id="fPhoto">
        <option value="">The place's photo</option>
        ${place.photos.map((ph, i) => `<option value="${esc(ph)}"${d.photo === ph ? ' selected' : ''}>Photo ${i + 1} of ${esc(place.name)}</option>`).join('')}
        ${d.photo && !place.photos.includes(d.photo) ? `<option value="${esc(d.photo)}" selected>The photo chosen before</option>` : ''}
      </select></div>
      <div class="actions">
        <button class="btn btn-main" id="saveBtn" type="button">${editing ? 'Save' : 'Add dish'}</button>
        ${editing ? '<button class="btn" id="cancelBtn" type="button">Cancel</button>' : ''}
      </div>`;
    e.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => open(k, b.dataset.edit)));
    e.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(b)));
    document.getElementById('saveBtn').addEventListener('click', save);
    if (editing) document.getElementById('cancelBtn').addEventListener('click', () => open(k));
  }

  async function save() {
    const $ = id => document.getElementById(id);
    const name = $('fName').value.trim(), kind = $('fKind').value.trim();
    if (!name) return toast('Give the dish a name.', true);
    if (!kind) return toast('Give the dish a kind, for example Smash burger.', true);
    const data = { placeColl: place.coll, placeId: place.id, name, kind, rating: Number($('fRating').value), note: $('fNote').value.trim(), photo: $('fPhoto').value, updatedAt: serverTimestamp() };
    const btn = $('saveBtn'); btn.disabled = true;
    try {
      if (editing) {
        await updateDoc(doc(db, 'dishes', editing.id), data);
        Object.assign(editing, data);
      } else {
        const ref = await addDoc(collection(db, 'dishes'), { ...data, createdAt: serverTimestamp() });
        dishes.push({ id: ref.id, ...data });
      }
      toast(editing ? 'Dish saved.' : 'Dish added. It shows on the place page right away.');
      open(placeKey(place));
    } catch (e) {
      console.log('Dish not saved:', e);
      toast(e.code === 'permission-denied' ? 'The database refused: add the dishes rule in Firebase first.' : 'Could not save. Try again.', true);
      btn.disabled = false;
    }
  }

  async function remove(btn) {
    if (!confirmTap(btn, '!')) { toast('Tap the ! again to delete this dish.'); return; }
    btn.disabled = true;
    try {
      await deleteDoc(doc(db, 'dishes', btn.dataset.del));
      dishes = dishes.filter(d => d.id !== btn.dataset.del);
      toast('Dish deleted.');
      open(placeKey(place));
    } catch (e) { console.log('Delete failed:', e); toast('Could not delete. Try again.', true); btn.disabled = false; }
  }
</script>
</body>
</html>
