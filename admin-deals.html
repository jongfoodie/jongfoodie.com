<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pro deals | Strong Foodie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF7F2; --warm-white: #FFFDF9; --ink: #1A1208; --ink-soft: #3D2F1A;
    --muted: #8A7A66; --border: rgba(26,18,8,0.12); --accent: #D4521A;
    --accent-pale: #FBF3EF; --gold: #C8901A; --green: #2D5A3D; --green-light: #E8F2EC; --red: #A32323;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); font-size: 15px; }
  .top { background: var(--ink); color: #fff; display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem; min-height: 58px; flex-wrap: wrap; }
  .top h1 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .top h1 span { color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.15em; margin-left: 6px; }
  .top nav { margin-left: auto; display: flex; gap: 1.1rem; }
  .top nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem; }
  .msg { max-width: 460px; margin: 4rem auto; text-align: center; color: var(--ink-soft); line-height: 1.6; }
  .msg h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 0.5rem; }
  .msg a { color: var(--accent); }
  .lead { color: var(--ink-soft); line-height: 1.6; margin-bottom: 1.25rem; }
  .card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem; margin-bottom: 1.1rem; }
  .card h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 0.25rem; }
  .card .sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 0.9rem; }
  label.lab { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 0.8rem 0 0.35rem; }
  input[type=search], input[type=date] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; }
  input:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .checks { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .checks label { display: flex; align-items: center; gap: 0.45rem; border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; cursor: pointer; font-size: 14px; background: #fff; }
  .checks input { accent-color: var(--accent); width: 16px; height: 16px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 0.3rem; line-height: 1.5; }
  .results { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.4rem; }
  .res { text-align: left; border: 1px dashed var(--border); background: #fff; border-radius: 10px; padding: 0.5rem 0.75rem; cursor: pointer; font: 14px 'DM Sans', sans-serif; color: var(--ink); }
  .res:hover { border-color: var(--accent); border-style: solid; }
  .res small { color: var(--muted); }
  .picked { background: #fff; border: 1px solid var(--accent); border-radius: 12px; padding: 0.6rem 0.8rem; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
  .btn { font: 500 14px 'DM Sans', sans-serif; padding: 9px 16px; border-radius: 22px; border: 1px solid var(--border); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--ink-soft); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-main { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-danger { color: var(--red); border-color: rgba(163,35,35,0.35); }
  .btn-danger[data-armed] { background: var(--red); color: #fff; }
  .grp { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 1.3rem 0 0.6rem; }
  .ad { background: var(--warm-white); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem 1rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.8rem; align-items: center; margin-bottom: 0.6rem; }
  .ad-name { font-weight: 700; overflow-wrap: anywhere; }
  .ad-meta { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .ad-tools { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
  .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase; margin-left: 6px; vertical-align: 2px; }
  .pill-live { background: var(--green-light); color: var(--green); }
  .pill-soon { background: #EFE8DC; color: var(--ink-soft); }
  .pill-ad { background: var(--ink); color: #fff; }
  .empty { background: var(--warm-white); border: 1px dashed var(--border); border-radius: 14px; padding: 1.5rem 1rem; text-align: center; color: var(--muted); }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all 0.25s; z-index: 100; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }
  @media (max-width: 700px) {
    .wrap { padding: 1rem 16px; }
    .top { padding: 0.7rem 16px; }
    .top nav { margin-left: 0; width: 100%; }
    .row2 { grid-template-columns: 1fr; gap: 0; }
    .ad { grid-template-columns: 1fr; }
    .ad-tools { justify-content: flex-start; }
  }
  input[type=text] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; }
  .pill-new { background: var(--green); color: #fff; }
  textarea.fld { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; min-height: 80px; resize: vertical; }
  .switch-line { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.9rem; font-size: 14px; }
  .switch-line input { width: 18px; height: 18px; accent-color: var(--accent); }
  .code-pill { font: 700 12px monospace; background: var(--accent-pale); color: var(--accent); padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div class="top"><h1>Strong Foodie <span>PRO DEALS</span></h1><nav><a href="deals.html" target="_blank" rel="noopener">🎟️ Deals page ↗</a><a href="admin.html">← Admin</a></nav></div>
<main class="wrap" id="root"><p class="msg">Checking your account…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { esc, fold, toDate, loadPlaces, placeKey, placeUrl } from "./js/sf-places.js?v=7";
  import { requireUnlock, nextLink } from "./js/sf-admin.js?v=6";
  import { confirmTap } from "./js/sf-delete.js?v=5";
  import { isLiveDeal } from "./js/sf-deals.js?v=1";

  const app = initializeApp({
    apiKey: "AIzaSyB_9UbXbYdY-TkYPLURESIkKAFLfYfwD3U",
    authDomain: "jongfoodie.firebaseapp.com",
    projectId: "jongfoodie",
    storageBucket: "jongfoodie.firebasestorage.app",
    messagingSenderId: "1006154240382",
    appId: "1:1006154240382:web:45dc5562f8205364aa232f"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  const root = document.getElementById('root');
  const BRAND_UID = 'B9cs5MwpvkUSIoiYh2qMwMnyl4B3';
  const refused = e => e && e.code === 'permission-denied';
  const ymd = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
  const endOfDay = v => { const d = new Date(v + 'T23:59:59'); return isNaN(d) ? null : d; };
  const nice = d => d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

  function toast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.toggle('error', error); t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), error ? 5000 : 2800);
  }

  let places = [], byKey = new Map(), items = [], codes = new Map(), editing = null, chosen = null;

  onAuthStateChanged(auth, async user => {
    if (!user) { root.innerHTML = `<div class="msg"><h2>Sign in first</h2><p>This page is for Strong Foodie only. <a href="${nextLink()}">Sign in on the admin page</a> and you come straight back here.</p></div>`; return; }
    let admin = user.uid === BRAND_UID;
    try { const t = await user.getIdTokenResult(); admin = admin || (t.claims && t.claims.admin === true); } catch (e) {}
    if (!admin) { root.innerHTML = `<div class="msg"><h2>Only for Strong Foodie</h2><p>This account can't manage deals.</p></div>`; return; }
    if (!(await requireUnlock(auth, user))) return;
    root.innerHTML = '<p class="msg">Loading…</p>';
    try {
      const [loaded, snap, codeSnap] = await Promise.all([loadPlaces(db), getDocs(collection(db, 'deals')), getDocs(collection(db, 'dealCodes')).catch(() => ({ docs: [] }))]);
      places = loaded.all.filter(p => !p.closed);
      loaded.all.forEach(p => byKey.set(placeKey(p), p));
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      codeSnap.docs.forEach(d => codes.set(d.id, String(d.data().code || '')));
      draw();
    } catch (e) {
      console.log('Deals error:', e);
      root.innerHTML = refused(e)
        ? '<div class="msg"><h2>Not switched on yet</h2><p>Add the rules for <code>deals</code> and <code>dealCodes</code> in Firebase first, then refresh.</p></div>'
        : '<div class="msg"><h2>Could not load</h2><p>Please refresh the page.</p></div>';
    }
  });

  function draw() {
    const live = items.filter(d => isLiveDeal(d)), off = items.filter(d => !isLiveDeal(d));
    const row = d => {
      const p = byKey.get(d.placeKey);
      return `<div class="ad"><div>
          <p class="ad-name">${esc(d.title)}${isLiveDeal(d) ? '<span class="pill pill-live">Live</span>' : '<span class="pill pill-soon">Off</span>'}</p>
          <p class="ad-meta">${p ? `<a href="${esc(placeUrl(p))}" target="_blank" rel="noopener" style="color:inherit;">${esc(p.name)}</a>` : esc(d.placeName || 'Removed place')}${toDate(d.until) ? ' · until ' + nice(toDate(d.until)) : ''}${codes.get(d.id) ? ` · code <span class="code-pill">${esc(codes.get(d.id))}</span>` : ' · no code'}</p>
        </div>
        <div class="ad-tools">
          <button class="btn btn-sm" type="button" data-edit="${esc(d.id)}">Edit</button>
          <button class="btn btn-sm btn-danger" type="button" data-del="${esc(d.id)}">Delete</button>
        </div></div>`;
    };
    root.innerHTML = `
      <p class="lead">Discounts at partner places for <b>Strong Foodie Pro</b> members. Everyone sees the deal on the <a href="deals.html" target="_blank" rel="noopener" style="color:var(--accent);">deals page</a>, on the place and in the app; only Pro members see the code.</p>
      <section class="card" id="form"></section>
      ${live.length ? `<p class="grp">Live · ${live.length}</p>${live.map(row).join('')}` : ''}
      ${off.length ? `<p class="grp">Off or ended · ${off.length}</p>${off.map(row).join('')}` : ''}
      ${items.length ? '' : '<div class="empty">No deals yet. Add the first one above.</div>'}`;
    drawForm();
    root.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => { editing = items.find(d => d.id === b.dataset.edit); chosen = byKey.get(editing.placeKey) || null; drawForm(); document.getElementById('form').scrollIntoView({ behavior: 'smooth' }); }));
    root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(b)));
  }

  function drawForm() {
    const f = document.getElementById('form');
    const d = editing || {};
    f.innerHTML = `
      <h2>${editing ? 'Edit deal' : 'Add a deal'}</h2>
      <p class="sub">What the deal is, at which place, and the code Pro members show or type in. No code? Then they mention Strong Foodie Pro.</p>
      <div id="pickedBox">${chosen ? `<div class="picked"><span>${esc(chosen.emoji)} <b>${esc(chosen.name)}</b> <small style="color:var(--muted)">${esc(chosen.where || '')}</small></span><button class="btn btn-sm" type="button" id="unpick">Change</button></div>` : `
        <input type="search" id="find" placeholder="Find the place…" aria-label="Find the place" autocomplete="off"><div class="results" id="res"></div>`}</div>
      <label class="lab" for="title">The deal</label>
      <input type="text" id="title" maxlength="60" placeholder="e.g. 10% off your bill" value="${esc(d.title || '')}">
      <label class="lab" for="details">Details (optional)</label>
      <textarea class="fld" id="details" maxlength="240" placeholder="e.g. Monday to Thursday, not with other offers.">${esc(d.details || '')}</textarea>
      <div class="row2">
        <div><label class="lab" for="code">Code (optional)</label><input type="text" id="code" maxlength="40" placeholder="STRONG10" value="${esc(editing ? codes.get(editing.id) || '' : '')}"></div>
        <div><label class="lab" for="until">Ends (optional)</label><input type="date" id="until" value="${ymd(toDate(d.until))}"></div>
      </div>
      <label class="switch-line"><input type="checkbox" id="active"${d.active === false ? '' : ' checked'}> Live (untick to pause it)</label>
      <div class="actions"><button class="btn btn-main" id="saveBtn" type="button">${editing ? 'Save' : 'Add deal'}</button>${editing || chosen ? '<button class="btn" id="cancelBtn" type="button">Cancel</button>' : ''}</div>`;
    const find = document.getElementById('find');
    if (find) find.addEventListener('input', () => {
      const q = fold(find.value).trim(), box = document.getElementById('res');
      if (q.length < 2) { box.innerHTML = ''; return; }
      const terms = q.split(/\s+/);
      const hits = places.filter(p => terms.every(t => p._name.includes(t) || p._place.includes(t))).slice(0, 8);
      box.innerHTML = hits.length ? hits.map(p => `<button class="res" type="button" data-k="${esc(placeKey(p))}">${esc(p.emoji)} ${esc(p.name)} <small>${esc(p.where || '')}</small></button>`).join('') : '<p class="hint">No place found.</p>';
      box.querySelectorAll('.res').forEach(b => b.addEventListener('click', () => { keep(); chosen = byKey.get(b.dataset.k); drawForm(); }));
    });
    const un = document.getElementById('unpick');
    if (un) un.addEventListener('click', () => { keep(); chosen = null; drawForm(); });
    document.getElementById('saveBtn').addEventListener('click', save);
    const c = document.getElementById('cancelBtn');
    if (c) c.addEventListener('click', () => { editing = null; chosen = null; draft = null; drawForm(); });
    if (draft) { ['title', 'details', 'code', 'until'].forEach(k => { document.getElementById(k).value = draft[k]; }); document.getElementById('active').checked = draft.active; draft = null; }
  }

  let draft = null;
  function keep() {
    draft = { title: document.getElementById('title').value, details: document.getElementById('details').value, code: document.getElementById('code').value, until: document.getElementById('until').value, active: document.getElementById('active').checked };
  }

  async function save() {
    if (!chosen) return toast('Pick the place first.', true);
    const title = document.getElementById('title').value.trim().slice(0, 60);
    if (!title) return toast('Say what the deal is.', true);
    const untilRaw = document.getElementById('until').value;
    const until = untilRaw ? endOfDay(untilRaw) : null;
    const code = document.getElementById('code').value.trim().slice(0, 40);
    const id = editing ? editing.id : doc(collection(db, 'deals')).id;
    const data = { placeKey: placeKey(chosen), placeName: chosen.name, title, details: document.getElementById('details').value.trim().slice(0, 240), until, active: document.getElementById('active').checked, updatedAt: serverTimestamp() };
    if (!editing) data.createdAt = serverTimestamp();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    try {
      await setDoc(doc(db, 'deals', id), data, { merge: true });
      if (code) await setDoc(doc(db, 'dealCodes', id), { code });
      else if (codes.get(id)) await deleteDoc(doc(db, 'dealCodes', id));
      if (code) codes.set(id, code); else codes.delete(id);
      const i = items.findIndex(d => d.id === id);
      if (i >= 0) items[i] = { ...items[i], ...data }; else items.push({ id, ...data });
      toast('Saved.');
      editing = null; chosen = null;
      draw();
    } catch (e) {
      console.log('Not saved:', e);
      toast(refused(e) ? 'The database refused: add the deals rules in Firebase first.' : 'Could not save. Try again.', true);
      btn.disabled = false;
    }
  }

  async function remove(btn) {
    if (!confirmTap(btn, 'Tap again to delete')) return;
    btn.disabled = true;
    const id = btn.dataset.del;
    try {
      await deleteDoc(doc(db, 'dealCodes', id)).catch(() => {});
      await deleteDoc(doc(db, 'deals', id));
      items = items.filter(d => d.id !== id); codes.delete(id);
      toast('Deleted.'); draw();
    } catch (e) { console.log('Not deleted:', e); toast('Could not delete. Try again.', true); btn.disabled = false; }
  }
</script>
</body>
</html>
