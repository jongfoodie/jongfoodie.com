<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Export | Strong Foodie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF7F2; --warm-white: #FFFDF9; --ink: #1A1208; --ink-soft: #3D2F1A;
    --muted: #8A7A66; --border: rgba(26,18,8,0.12); --accent: #D4521A;
    --accent-pale: #FBF3EF; --gold: #C8901A; --green: #2D5A3D; --green-light: #E8F2EC; --red: #A32323;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); font-size: 15px; }
  .top { background: var(--ink); color: #fff; display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem; min-height: 58px; flex-wrap: wrap; }
  .top h1 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .top h1 span { color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.15em; margin-left: 6px; }
  .top nav { margin-left: auto; display: flex; gap: 1.1rem; }
  .top nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem; }
  .msg { max-width: 460px; margin: 4rem auto; text-align: center; color: var(--ink-soft); line-height: 1.6; }
  .msg h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 0.5rem; }
  .msg a { color: var(--accent); }
  .lead { color: var(--ink-soft); line-height: 1.6; margin-bottom: 1.25rem; }
  .card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem; margin-bottom: 1.1rem; }
  .card h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 0.25rem; }
  .card .sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 0.9rem; }
  label.lab { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 0.8rem 0 0.35rem; }
  input[type=search], input[type=date] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; }
  input:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .checks { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .checks label { display: flex; align-items: center; gap: 0.45rem; border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; cursor: pointer; font-size: 14px; background: #fff; }
  .checks input { accent-color: var(--accent); width: 16px; height: 16px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 0.3rem; line-height: 1.5; }
  .results { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.4rem; }
  .res { text-align: left; border: 1px dashed var(--border); background: #fff; border-radius: 10px; padding: 0.5rem 0.75rem; cursor: pointer; font: 14px 'DM Sans', sans-serif; color: var(--ink); }
  .res:hover { border-color: var(--accent); border-style: solid; }
  .res small { color: var(--muted); }
  .picked { background: #fff; border: 1px solid var(--accent); border-radius: 12px; padding: 0.6rem 0.8rem; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
  .btn { font: 500 14px 'DM Sans', sans-serif; padding: 9px 16px; border-radius: 22px; border: 1px solid var(--border); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--ink-soft); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-main { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-danger { color: var(--red); border-color: rgba(163,35,35,0.35); }
  .btn-danger[data-armed] { background: var(--red); color: #fff; }
  .grp { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 1.3rem 0 0.6rem; }
  .ad { background: var(--warm-white); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem 1rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.8rem; align-items: center; margin-bottom: 0.6rem; }
  .ad-name { font-weight: 700; overflow-wrap: anywhere; }
  .ad-meta { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .ad-tools { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
  .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase; margin-left: 6px; vertical-align: 2px; }
  .pill-live { background: var(--green-light); color: var(--green); }
  .pill-soon { background: #EFE8DC; color: var(--ink-soft); }
  .pill-ad { background: var(--ink); color: #fff; }
  .empty { background: var(--warm-white); border: 1px dashed var(--border); border-radius: 14px; padding: 1.5rem 1rem; text-align: center; color: var(--muted); }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all 0.25s; z-index: 100; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }
  @media (max-width: 700px) {
    .wrap { padding: 1rem 16px; }
    .top { padding: 0.7rem 16px; }
    .top nav { margin-left: 0; width: 100%; }
    .row2 { grid-template-columns: 1fr; gap: 0; }
    .ad { grid-template-columns: 1fr; }
    .ad-tools { justify-content: flex-start; }
  }
  input[type=text] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; }
  .pill-new { background: var(--green); color: #fff; }
  textarea.fld { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; min-height: 80px; resize: vertical; }
  .switch-line { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.9rem; font-size: 14px; }
  .switch-line input { width: 18px; height: 18px; accent-color: var(--accent); }
  .code-pill { font: 700 12px monospace; background: var(--accent-pale); color: var(--accent); padding: 2px 8px; border-radius: 6px; }
  .sheets { list-style: none; display: grid; gap: 0.45rem; margin: 0.4rem 0 0.2rem; }
  .sheets li { display: flex; justify-content: space-between; gap: 1rem; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.8rem; font-size: 14px; }
  .sheets li span:last-child { color: var(--ink-soft); white-space: nowrap; }
</style>
</head>
<body>
<div class="top"><h1>Strong Foodie <span>EXPORT</span></h1><nav><a href="admin-stats.html">📊 Numbers</a><a href="admin.html">← Admin</a></nav></div>
<main class="wrap" id="root"><p class="msg">Checking your account…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { esc, toDate, normalise, isPublished, CATS, SITE, placeUrl } from "./js/sf-places.js?v=7";
  import { memberListUrl } from "./js/sf-memberlists.js?v=1";
  import { requireUnlock, nextLink } from "./js/sf-admin.js?v=6";

  // Everything in one Excel file: places, member reviews, members and member lists.
  // Members: only the name, when they joined, private or not, and Pro. Nothing
  // else from their profile (no dating details, no birth date).

  const app = initializeApp({
    apiKey: "AIzaSyB_9UbXbYdY-TkYPLURESIkKAFLfYfwD3U",
    authDomain: "jongfoodie.firebaseapp.com",
    projectId: "jongfoodie",
    storageBucket: "jongfoodie.firebasestorage.app",
    messagingSenderId: "1006154240382",
    appId: "1:1006154240382:web:45dc5562f8205364aa232f"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  const root = document.getElementById('root');
  const BRAND_UID = 'B9cs5MwpvkUSIoiYh2qMwMnyl4B3';
  const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  const CATALOG = Object.keys(CATS).map(k => CATS[k].coll);
  const refused = e => e && e.code === 'permission-denied';
  const ymd = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
  const day = v => { const d = toDate(v); return d && !isNaN(d) ? new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) : ''; };
  const cut = (v, n = 2000) => String(v ?? '').slice(0, n);

  function toast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.toggle('error', error); t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), error ? 5000 : 2800);
  }

  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = XLSX_SRC;
      s.onload = () => window.XLSX ? ok(window.XLSX) : fail(new Error('no XLSX'));
      s.onerror = () => fail(new Error('XLSX did not load'));
      document.head.appendChild(s);
    });
  }

  onAuthStateChanged(auth, async user => {
    if (!user) { root.innerHTML = `<div class="msg"><h2>Sign in first</h2><p>This page is for Strong Foodie only. <a href="${nextLink()}">Sign in on the admin page</a> and you come straight back here.</p></div>`; return; }
    let admin = user.uid === BRAND_UID;
    try { const t = await user.getIdTokenResult(); admin = admin || (t.claims && t.claims.admin === true); } catch (e) {}
    if (!admin) { root.innerHTML = `<div class="msg"><h2>Only for Strong Foodie</h2><p>This account can't export.</p></div>`; return; }
    if (!(await requireUnlock(auth, user))) return;
    root.innerHTML = `
      <p class="lead">Download everything as one Excel file, to sort, filter or keep as a backup.</p>
      <section class="card">
        <h2>Excel file</h2>
        <p class="sub">Four sheets:</p>
        <ul class="sheets">
          <li><span>📍 Places</span><span>reviews and member spots</span></li>
          <li><span>⭐ Member reviews</span><span>rating, text, who and when</span></li>
          <li><span>👤 Members</span><span>name, joined, private, Pro</span></li>
          <li><span>📋 Lists</span><span>lists by members</span></li>
        </ul>
        <div class="actions"><button class="btn btn-main" id="goBtn" type="button">⬇️ Download Excel</button></div>
        <p class="hint" id="state"></p>
      </section>`;
    document.getElementById('goBtn').addEventListener('click', run);
  });

  async function readAll(c) {
    const s = await getDocs(collection(db, c));
    return s.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  async function run() {
    const btn = document.getElementById('goBtn'), state = document.getElementById('state');
    btn.disabled = true; state.textContent = 'Collecting…';
    try {
      const now = new Date();
      const [XLSX, cat, members, reviews, profiles, lists] = await Promise.all([
        loadXlsx(),
        Promise.all(CATALOG.map(c => readAll(c).then(rs => rs.map(r => [c, r])))).then(x => x.flat()),
        readAll('userPlaces'),
        readAll('userReviews'),
        readAll('profiles'),
        readAll('memberLists').catch(() => []),
      ]);
      const nameOf = new Map(profiles.map(p => [p.id, String(p.displayName || '')]));

      const status = r => r.mergedInto ? 'Merged' : r.status === 'draft' ? 'Draft' : (r.status === 'hidden' || r.hidden === true) ? 'Hidden' : toDate(r.publishAt) > now ? 'Scheduled' : 'Live';
      const placeRow = (c, r, member) => {
        const p = normalise(c, r.id, r, member);
        return {
          Kind: member ? 'Member spot' : 'Strong Foodie review',
          Category: CATS[p.cat] ? CATS[p.cat].label : '',
          Name: cut(r.name, 200),
          Address: cut(member ? [r.address, r.city].filter(Boolean).join(', ') : (r.city || r.address || ''), 300),
          City: p.destination || p.town || '',
          Country: p.country || '',
          'SF score': !member && typeof r.rating === 'number' && r.rating > 0 ? r.rating : '',
          Price: cut(r.price, 40),
          Phone: cut(r.phone, 40),
          'Opening hours': cut(r.hours, 300),
          Closed: r.closedStatus === 'perm' ? 'Permanently' : r.closedStatus === 'temp' ? 'Temporarily' : '',
          Status: member ? (r.mergedInto ? 'Merged' : r.hidden === true ? 'Hidden' : 'Live') : (r.mergedInto ? 'Merged' : isPublished(r, now) ? 'Live' : status(r)),
          'Added by': member ? (nameOf.get(r.addedByUserId) || r.addedByName || '') : 'Strong Foodie',
          Added: day(r.createdAt),
          Link: SITE + placeUrl(p),
        };
      };
      const placesSheet = cat.filter(([, r]) => r.name).map(([c, r]) => placeRow(c, r, false))
        .concat(members.filter(r => r.name).map(r => placeRow('userPlaces', r, true)));

      const reviewSheet = reviews.map(r => ({
        Place: cut(r.placeName, 200),
        Rating: typeof r.rating === 'number' ? r.rating : '',
        Review: cut(r.text, 1500),
        By: nameOf.get(r.authorId) || cut(r.authorName, 80),
        Date: day(r.createdAt),
        Hidden: r.hidden === true ? 'Yes' : '',
        Photo: typeof r.photoUrl === 'string' && /^https?:/.test(r.photoUrl) ? r.photoUrl : '',
      }));

      const memberSheet = profiles.map(p => ({
        Name: cut(p.displayName, 80),
        Joined: day(p.createdAt),
        Private: p.isPrivate === true ? 'Yes' : '',
        'Pro until': toDate(p.proUntil) && toDate(p.proUntil) > now ? day(p.proUntil) : '',
        Profile: `${SITE}/member.html?u=${encodeURIComponent(p.id)}`,
      }));

      const listSheet = lists.map(l => ({
        Title: cut(l.title, 80),
        By: nameOf.get(l.authorId) || '',
        City: cut(l.city, 60),
        Places: Array.isArray(l.places) ? l.places.length : 0,
        Status: l.hidden === true ? 'Hidden' : l.status === 'published' ? 'Published' : 'Draft',
        Published: day(l.publishedAt),
        Link: l.status === 'published' && l.hidden !== true ? SITE + memberListUrl(l) : '',
      }));

      const wb = XLSX.utils.book_new();
      const add = (rows, name, widths) => {
        const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ '': 'Nothing yet' }], { cellDates: true, dateNF: 'yyyy-mm-dd' });
        ws['!cols'] = widths.map(w => ({ wch: w }));
        if (rows.length) ws['!autofilter'] = { ref: ws['!ref'] };
        XLSX.utils.book_append_sheet(wb, ws, name);
      };
      add(placesSheet, 'Places', [20, 10, 30, 36, 16, 14, 8, 8, 16, 30, 12, 9, 18, 11, 50]);
      add(reviewSheet, 'Member reviews', [30, 7, 60, 18, 11, 7, 40]);
      add(memberSheet, 'Members', [24, 11, 8, 11, 60]);
      add(listSheet, 'Lists', [36, 18, 16, 7, 10, 11, 60]);
      XLSX.writeFile(wb, `strongfoodie-export-${ymd(now)}.xlsx`, { compression: true });
      state.textContent = `Done: ${placesSheet.length} places, ${reviewSheet.length} member reviews, ${memberSheet.length} members, ${listSheet.length} lists.`;
    } catch (e) {
      console.log('Export error:', e);
      state.textContent = '';
      toast(refused(e) ? 'The database refused to read everything.' : /XLSX/.test(String(e && e.message)) ? 'The Excel tool did not load. Check your connection and try again.' : 'Could not make the file. Try again.', true);
    }
    btn.disabled = false;
  }
</script>
</body>
</html>
