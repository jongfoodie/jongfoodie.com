<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Report per place | Strong Foodie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF7F2; --warm-white: #FFFDF9; --ink: #1A1208; --ink-soft: #3D2F1A;
    --muted: #7A6A56; --border: rgba(26,18,8,0.12); --accent: #D4521A;
    --accent-pale: #FBF3EF; --gold: #C8901A; --green: #2D5A3D; --green-light: #E8F2EC; --red: #A32323;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); font-size: 15px; }
  .top { background: var(--ink); color: #fff; display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem; min-height: 58px; flex-wrap: wrap; }
  .top h1 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .top h1 span { color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.15em; margin-left: 6px; }
  .top nav { margin-left: auto; display: flex; gap: 1.1rem; }
  .top nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem; }
  .msg { max-width: 460px; margin: 4rem auto; text-align: center; color: var(--ink-soft); line-height: 1.6; }
  .msg h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 0.5rem; }
  .msg a { color: var(--accent); }
  .controls { background: var(--warm-white); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 1.2rem; }
  .controls .row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.6rem; align-items: end; }
  label.lab { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 0.3rem; }
  input[type=search], select { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 15px 'DM Sans', sans-serif; background: #fff; color: var(--ink); outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  .results { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.4rem; }
  .res { text-align: left; border: 1px dashed var(--border); background: #fff; border-radius: 10px; padding: 0.5rem 0.75rem; cursor: pointer; font: 14px 'DM Sans', sans-serif; color: var(--ink); }
  .res:hover { border-color: var(--accent); border-style: solid; }
  .res small { color: var(--muted); }
  .btns { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.8rem; }
  .btn { font: 500 14px 'DM Sans', sans-serif; padding: 9px 16px; border-radius: 22px; border: 1px solid var(--border); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--ink-soft); }
  .btn-main { background: var(--accent); color: #fff; border-color: var(--accent); }

  .report { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 2rem; }
  .r-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; margin-bottom: 1.4rem; flex-wrap: wrap; }
  .brand { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; }
  .brand span { color: var(--accent); }
  .r-kind { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .r-month { font-family: 'Playfair Display', serif; font-size: 20px; text-align: right; }
  .r-place h2 { font-family: 'Playfair Display', serif; font-size: 1.9rem; line-height: 1.15; overflow-wrap: anywhere; }
  .r-place p { color: var(--muted); margin-top: 0.3rem; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.7rem; margin: 1.4rem 0; }
  .tile { border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; line-height: 1.15; margin: 0.2rem 0; }
  .tile .d { font-size: 12.5px; color: var(--ink-soft); }
  .tile .d.up { color: var(--green); } .tile .d.down { color: var(--red); }
  .sec { margin-top: 1.4rem; }
  .sec h3 { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 0.6rem; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .bar { fill: var(--accent); }
  .chart .bar.dim { fill: #E8B79F; }
  .chart text { font: 12px 'DM Sans', sans-serif; fill: #6B5D4D; }
  .chart text.val { fill: var(--ink); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .lists { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
  .lists li { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--border); padding: 0.35rem 0; font-size: 14px; }
  .lists b { color: var(--accent); white-space: nowrap; }
  .adbox { background: var(--accent-pale); border-radius: 12px; padding: 0.8rem 1rem; font-size: 14px; line-height: 1.5; }
  .foot { margin-top: 1.6rem; padding-top: 0.8rem; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.55; }
  .na { color: var(--muted); font-size: 13px; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all 0.25s; z-index: 100; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 700px) {
    .wrap { padding: 1rem 16px; }
    .top { padding: 0.7rem 16px; }
    .top nav { margin-left: 0; width: 100%; }
    .controls .row { grid-template-columns: 1fr 1fr; }
    .controls .row > :first-child { grid-column: 1 / -1; }
    .report { padding: 1.1rem; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .r-month { text-align: left; }
  }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    .top, .controls, .toast { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .report { border: 0; padding: 0; }
    .tiles { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<div class="top"><h1>Strong Foodie <span>REPORT</span></h1><nav><a href="admin-ads.html">📣 Ads</a><a href="admin.html">← Admin</a></nav></div>
<main class="wrap" id="root"><p class="msg">Checking your account…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, collectionGroup, getDocs, getDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { CATS, esc, fold, toDate, loadPlaces, loadLists, placeKey, placeUrl, SITE } from "./js/sf-places.js?v=7";
  import { viewId } from "./js/sf-views.js?v=2";
  import { requireUnlock, nextLink } from "./js/sf-admin.js?v=4";

  const app = initializeApp({
    apiKey: "AIzaSyB_9UbXbYdY-TkYPLURESIkKAFLfYfwD3U",
    authDomain: "jongfoodie.firebaseapp.com",
    projectId: "jongfoodie",
    storageBucket: "jongfoodie.firebasestorage.app",
    messagingSenderId: "1006154240382",
    appId: "1:1006154240382:web:45dc5562f8205364aa232f"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  const root = document.getElementById('root');
  const BRAND_UID = 'B9cs5MwpvkUSIoiYh2qMwMnyl4B3';

  // The report is for the business: English or Dutch.
  const T = {
    en: { kind: 'Monthly report', books: 'Clicks on Reserve or Book', views: 'Page views', vsPrev: 'vs the month before', noPrev: 'first month counted', saves: 'On wishlists', savesNew: 'new this month', reviews: 'Member reviews', avg: 'average', none: 'none yet', highlights: 'Highlights', hlSub: 'photos and videos by members', chart: 'Page views per month', month: 'Month', listsH: 'In the best-of lists', rank: (i, n) => `#${i} of ${n}`, noLists: 'Not in a best-of list yet.', ad: 'Featured partner', adLine: (s, e, w) => `Featured with an Ad label from ${s} to ${e}, on ${w}.`, where: { home: 'the homepage', city: 'the city page', place: 'its own page' }, score: 'Strong Foodie score', foot: 'Page views are counted on strongfoodie.com without cookies: one view per visitor per page per 30 minutes; visits by Strong Foodie itself are not counted. Views in the app follow once the new app version is out. Reviews and scores are never paid for.', na: 'not available', sumLead: (p, m) => `Strong Foodie report for ${p}, ${m}:` },
    nl: { kind: 'Maandrapport', books: 'Klikken op Reserveren of Boeken', views: 'Paginaweergaven', vsPrev: 'ten opzichte van de maand ervoor', noPrev: 'eerste gemeten maand', saves: 'Op wishlists', savesNew: 'nieuw deze maand', reviews: 'Ledenreviews', avg: 'gemiddeld', none: 'nog geen', highlights: 'Highlights', hlSub: "foto's en video's van leden", chart: 'Paginaweergaven per maand', month: 'Maand', listsH: 'In de best-of lijsten', rank: (i, n) => `#${i} van ${n}`, noLists: 'Nog niet in een best-of lijst.', ad: 'Uitgelichte partner', adLine: (s, e, w) => `Uitgelicht met een Ad-label van ${s} tot ${e}, op ${w}.`, where: { home: 'de homepage', city: 'de stadspagina', place: 'de eigen pagina' }, score: 'Strong Foodie-score', foot: 'Paginaweergaven worden geteld op strongfoodie.com zonder cookies: één weergave per bezoeker per pagina per 30 minuten; bezoeken van Strong Foodie zelf tellen niet mee. Weergaven in de app volgen zodra de nieuwe app-versie uit is. Reviews en scores zijn nooit betaald.', na: 'niet beschikbaar', sumLead: (p, m) => `Strong Foodie-rapport voor ${p}, ${m}:` },
  };
  let lang = 'en';
  const LOC = () => lang === 'nl' ? 'nl-NL' : 'en-GB';
  const monthKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const monthName = (key, long = true) => { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(LOC(), long ? { month: 'long', year: 'numeric' } : { month: 'short' }); };
  const nf = n => Number(n || 0).toLocaleString(LOC());
  const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString(LOC(), { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

  let all = [], byKey = new Map(), lists = [], promos = [], wishAll = null, place = null, month = monthKey(new Date());

  onAuthStateChanged(auth, async user => {
    if (!user) { root.innerHTML = `<div class="msg"><h2>Sign in first</h2><p>This page is for Strong Foodie only. <a href="${nextLink()}">Sign in on the admin page</a> and you come straight back here.</p></div>`; return; }
    let admin = user.uid === BRAND_UID;
    try { const t = await user.getIdTokenResult(); admin = admin || (t.claims && t.claims.admin === true); } catch (e) {}
    if (!admin) { root.innerHTML = `<div class="msg"><h2>Only for Strong Foodie</h2><p>This account can't see reports.</p></div>`; return; }
    if (!(await requireUnlock(auth, user))) return;
    root.innerHTML = '<p class="msg">Loading…</p>';
    try {
      const loaded = await loadPlaces(db);
      all = loaded.all;
      all.forEach(p => byKey.set(placeKey(p), p));
      const [ls, pr] = await Promise.all([loadLists(db, all), getDocs(collection(db, 'promos')).then(s => s.docs.map(d => ({ id: d.id, ...d.data() }))).catch(() => [])]);
      lists = ls; promos = pr;
      const want = new URLSearchParams(location.search).get('place');
      place = want && byKey.has(want) ? byKey.get(want) : null;
      shell();
      if (place) drawReport();
    } catch (e) {
      console.log('Report error:', e);
      root.innerHTML = '<div class="msg"><h2>Could not load</h2><p>Please refresh the page.</p></div>';
    }
  });

  function shell() {
    const months = Array.from({ length: 12 }, (_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); return monthKey(d); });
    root.innerHTML = `
      <div class="controls">
        <div class="row">
          <div><label class="lab" for="find">Place</label><input type="search" id="find" placeholder="${place ? esc(place.name) : 'Find a place…'}" aria-label="Find a place" autocomplete="off"></div>
          <div><label class="lab" for="month">Month</label><select id="month">${months.map(m => `<option value="${m}"${m === month ? ' selected' : ''}>${esc(new Date(m + '-01T12:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }))}</option>`).join('')}</select></div>
          <div><label class="lab" for="lang">Language</label><select id="lang"><option value="en">English</option><option value="nl">Nederlands</option></select></div>
        </div>
        <div class="results" id="res"></div>
        <div class="btns"><button class="btn btn-main" id="printBtn" type="button">🖨️ Print or save as PDF</button><button class="btn" id="copyBtn" type="button">Copy as text for an email</button></div>
      </div>
      <div id="report">${place ? '' : '<p class="msg">Pick a place to see its report.</p>'}</div>`;
    document.getElementById('lang').value = lang;
    const find = document.getElementById('find'), res = document.getElementById('res');
    find.addEventListener('input', () => {
      const q = fold(find.value).trim();
      if (q.length < 2) { res.innerHTML = ''; return; }
      const terms = q.split(/\s+/);
      const hits = all.filter(p => terms.every(t => p._name.includes(t) || p._place.includes(t))).slice(0, 8);
      res.innerHTML = hits.map(p => `<button class="res" type="button" data-k="${esc(placeKey(p))}">${esc(p.emoji)} ${esc(p.name)} <small>${esc(p.where || '')}</small></button>`).join('') || '<p class="na">No place found.</p>';
      res.querySelectorAll('.res').forEach(b => b.addEventListener('click', () => {
        place = byKey.get(b.dataset.k); find.value = ''; find.placeholder = place.name; res.innerHTML = '';
        history.replaceState(null, '', `?place=${encodeURIComponent(b.dataset.k)}`);
        drawReport();
      }));
    });
    document.getElementById('month').addEventListener('change', e => { month = e.target.value; if (place) drawReport(); });
    document.getElementById('lang').addEventListener('change', e => { lang = e.target.value; if (place) drawReport(); });
    document.getElementById('printBtn').addEventListener('click', () => { if (!place) return toast('Pick a place first.'); window.print(); });
    document.getElementById('copyBtn').addEventListener('click', copySummary);
  }

  let last = null;   // the numbers of the report on screen, for the email text

  async function drawReport() {
    const box = document.getElementById('report');
    box.innerHTML = '<p class="msg">Counting…</p>';
    const key = placeKey(place), t = T[lang];
    const [y, m] = month.split('-').map(Number);
    const months = Array.from({ length: 6 }, (_, i) => monthKey(new Date(y, m - 1 - (5 - i), 1)));
    const from = new Date(y, m - 1, 1), to = new Date(y, m, 1);
    const inMonth = d => d && d >= from && d < to;

    const count = (type, mk) => getDoc(doc(db, 'views', viewId(type, key, mk))).then(s => s.exists() ? Number(s.data().count) || 0 : 0).catch(() => null);
    // Taps on Reserve or Book (js/sf-booking.js): shown only when there were any.
    const [views, books] = await Promise.all([Promise.all(months.map(mk => count('place', mk))), Promise.all(months.map(mk => count('book', mk)))]);
    const hasBooks = books.some(n => n > 0);
    const [revSnap, hlSnap] = await Promise.all([
      getDocs(query(collection(db, 'userReviews'), where('placeDocId', '==', place.id))).catch(() => ({ docs: [] })),
      getDocs(query(collection(db, 'highlights'), where('placeId', '==', place.id))).catch(() => ({ docs: [] })),
    ]);
    const reviews = revSnap.docs.map(d => d.data()).filter(r => (!r.placeCollection || r.placeCollection === place.coll) && typeof r.rating === 'number' && r.hidden !== true);
    const hls = hlSnap.docs.map(d => d.data()).filter(h => h.hidden !== true);
    if (wishAll === null) {
      // Every wishlist item (collection group), counted here only: needs the admin rule for wishlistItems.
      wishAll = await getDocs(collectionGroup(db, 'wishlistItems')).then(s => s.docs.map(d => d.data())).catch(e => { console.log('Wishlists not readable:', e.code || e); return undefined; });
    }
    const wish = wishAll ? wishAll.filter(w => w.placeDocId === place.id && (!w.placeCollection || w.placeCollection === place.coll)) : null;
    const inLists = lists.map(l => ({ l, i: l.places.findIndex(p => placeKey(p) === key) })).filter(x => x.i >= 0).sort((a, b) => a.i - b.i);
    const ads = promos.filter(a => a.placeKey === key && toDate(a.start) < to && toDate(a.end) > from);

    const vNow = views[5], vPrev = views[4];
    const change = vNow !== null && vPrev ? Math.round((vNow - vPrev) / vPrev * 100) : null;
    const avg = reviews.length ? reviews.reduce((a, r) => a + r.rating, 0) / reviews.length : 0;
    const cat = CATS[place.cat];
    last = { views: vNow, change, saves: wish ? wish.length : null, reviews: reviews.length, avg, hls: hls.length, lists: inLists, books: hasBooks ? books[5] : null };

    box.innerHTML = `<article class="report">
      <div class="r-head">
        <div><p class="brand">Strong <span>Foodie</span></p><p class="r-kind">${t.kind}</p></div>
        <p class="r-month">${esc(monthName(month))}</p>
      </div>
      <div class="r-place">
        <h2>${esc(place.name)}</h2>
        <p>${esc([cat ? cat.label : '', place.where].filter(Boolean).join(' · '))}${place.rating && !place.member ? ` · ${t.score} ${fmt1(place.rating)}` : ''} · ${esc((SITE || 'https://strongfoodie.com') + placeUrl(place).replace(/^\./, ''))}</p>
      </div>
      <div class="tiles">
        <div class="tile"><p class="k">${t.views}</p><p class="v">${vNow === null ? '?' : nf(vNow)}</p><p class="d ${change > 0 ? 'up' : change < 0 ? 'down' : ''}">${change === null ? t.noPrev : `${change > 0 ? '+' : ''}${change}% ${t.vsPrev}`}</p></div>
        <div class="tile"><p class="k">${t.saves}</p><p class="v">${wish ? nf(wish.length) : '?'}</p><p class="d">${wish ? `${nf(wish.filter(w => inMonth(toDate(w.createdAt))).length)} ${t.savesNew}` : t.na}</p></div>
        <div class="tile"><p class="k">${t.reviews}</p><p class="v">${nf(reviews.length)}</p><p class="d">${reviews.length ? `${t.avg} ${fmt1(avg)} ★` : t.none}</p></div>
        <div class="tile"><p class="k">${t.highlights}</p><p class="v">${nf(hls.length)}</p><p class="d">${t.hlSub}</p></div>
      </div>
      <section class="sec"><h3>${t.chart}</h3><div class="chart">${chart(months, views)}</div>
        <table><thead><tr><th>${t.month}</th><th class="n">${t.views}</th>${hasBooks ? `<th class="n">${t.books}</th>` : ''}</tr></thead><tbody>${months.map((mk, i) => `<tr><td>${esc(monthName(mk))}</td><td class="n">${views[i] === null ? '?' : nf(views[i])}</td>${hasBooks ? `<td class="n">${books[i] === null ? '?' : nf(books[i])}</td>` : ''}</tr>`).reverse().join('')}</tbody></table>
      </section>
      <section class="sec"><h3>${t.listsH}</h3>${inLists.length ? `<ul class="lists">${inLists.map(x => `<li><span>${esc(x.l.title)}</span><b>${t.rank(x.i + 1, x.l.places.length)}</b></li>`).join('')}</ul>` : `<p class="na">${t.noLists}</p>`}</section>
      ${ads.length ? `<section class="sec"><h3>${t.ad}</h3>${ads.map(a => `<p class="adbox">${esc(t.adLine(toDate(a.start).toLocaleDateString(LOC(), { day: 'numeric', month: 'long' }), toDate(a.end).toLocaleDateString(LOC(), { day: 'numeric', month: 'long' }), (a.where || []).map(w => t.where[w]).filter(Boolean).join(', ')))}</p>`).join('')}</section>` : ''}
      <p class="foot">${t.foot}</p>
    </article>`;
  }

  // Views per month: one series, the chosen month in full colour, the months before lighter.
  function chart(months, views) {
    const W = 600, H = 190, pad = { l: 8, r: 8, t: 22, b: 26 };
    const max = Math.max(1, ...views.map(v => v || 0));
    const bw = (W - pad.l - pad.r) / months.length;
    const bars = months.map((mk, i) => {
      const v = views[i] || 0, h = Math.round((H - pad.t - pad.b) * v / max);
      const x = pad.l + i * bw + bw * 0.2, w = bw * 0.6, yTop = H - pad.b - h;
      const r = Math.min(4, h / 2, w / 2);
      const path = h > 0 ? `M${x},${H - pad.b} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${H - pad.b} Z` : '';
      const last = i === months.length - 1;
      return `${path ? `<path class="bar${last ? '' : ' dim'}" d="${path}"><title>${esc(monthName(mk))}: ${nf(v)}</title></path>` : ''}
        ${last ? `<text class="val" x="${x + w / 2}" y="${yTop - 6}" text-anchor="middle">${views[i] === null ? '?' : nf(v)}</text>` : ''}
        <text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(monthName(mk, false))}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T[lang].chart)}"><line x1="${pad.l}" x2="${W - pad.r}" y1="${H - pad.b}" y2="${H - pad.b}" stroke="rgba(26,18,8,0.2)"/>${bars}</svg>`;
  }

  async function copySummary() {
    if (!place || !last) return toast('Pick a place first.');
    const t = T[lang], L = last;
    const lines = [
      t.sumLead(place.name, monthName(month)),
      `- ${t.views}: ${L.views === null ? '?' : nf(L.views)}${L.change === null ? '' : ` (${L.change > 0 ? '+' : ''}${L.change}% ${t.vsPrev})`}`,
      L.saves === null ? '' : `- ${t.saves}: ${nf(L.saves)}`,
      `- ${t.reviews}: ${nf(L.reviews)}${L.reviews ? ` (${t.avg} ${fmt1(L.avg)})` : ''}`,
      `- ${t.highlights}: ${nf(L.hls)}`,
      L.books === null ? '' : `- ${t.books}: ${nf(L.books)}`,
      ...L.lists.slice(0, 3).map(x => `- ${x.l.title}: ${t.rank(x.i + 1, x.l.places.length)}`),
    ].filter(Boolean);
    try { await navigator.clipboard.writeText(lines.join('\n')); toast('Copied. Paste it in your email.'); }
    catch (e) { window.prompt('Copy this:', lines.join('\n')); }
  }
</script>
</body>
</html>
